[package]
name = "conflux"
version = "0.1.1"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.22"
brotli = "9.1.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.11"
fs2 = "0.4.3"
futures-util = "0.3.34"
http = "1"
rand = "0.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "form", "query", "http2", "gzip", "brotli", "deflate", "zstd"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.2.1"
toml_edit = "0.25.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.1", features = ["v4", "v5"] }
zstd = "0.14.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[dev-dependencies]
tempfile = "3.27.0"
