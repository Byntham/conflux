name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency: release

permissions:
  contents: write

env:
  AWS_LC_SYS_PREBUILT_NASM: "1"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            patch) next="$major.$minor.$((patch + 1))" ;;
          esac
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$next")" ]; then
            echo "v$next is already released. Cargo.toml on this branch says $current." >&2
            exit 1
          fi
          sed -i "0,/^version = \"$current\"$/s//version = \"$next\"/" Cargo.toml
          awk -v v="$next" '
            prev == "name = \"conflux\"" && /^version = / { $0 = "version = \"" v "\"" }
            { print; prev = $0 }
          ' Cargo.lock > Cargo.lock.new
          mv Cargo.lock.new Cargo.lock
          git diff --stat
          [ "$(git diff --numstat | wc -l)" = 2 ]
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: bump
          path: |
            Cargo.toml
            Cargo.lock
          if-no-files-found: error

  test:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bump
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  build:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: conflux-linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: conflux-linux-aarch64
          - os: macos-26
            target: aarch64-apple-darwin
            asset: conflux-darwin-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: conflux-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bump
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bin=target/${{ matrix.target }}/release/conflux
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" "${{ matrix.asset }}"
          reported=$("./${{ matrix.asset }}" --version)
          if [ "$reported" != "conflux $VERSION" ]; then
            echo "The built binary reports '$reported', not 'conflux $VERSION'. Machines compare the two to decide whether to update." >&2
            exit 1
          fi
      - if: matrix.target == 'aarch64-apple-darwin'
        run: macos/build-app.sh "${{ matrix.asset }}" target/app
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
      - if: matrix.target == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: conflux-darwin-aarch64-app.zip
          path: target/app/conflux-darwin-aarch64-app.zip
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bump
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: conflux-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release v$VERSION"
          git push origin HEAD:main
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --generate-notes
